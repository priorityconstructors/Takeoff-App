<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Take-Off">
<meta name="theme-color" content="#1565C0">
<link rel="manifest" href="manifest.json">
<title>Board Take-Off</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;background:#fff}
.app-bar{background:#1565C0;color:white;padding:16px 16px 12px;flex-shrink:0}
.app-bar .title{font-size:17px;font-weight:600}
.app-bar .sub{font-size:12px;opacity:0.75;margin-top:2px}
.app-bar-row{display:flex;justify-content:space-between;align-items:flex-start}
.step-info{font-size:12px;opacity:0.75;text-align:right}
.progress-bar{display:flex;gap:3px;padding:10px 16px 0;background:#1565C0;flex-shrink:0}
.pip{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.3)}
.pip.done{background:white}
.pip.active{background:rgba(255,255,255,0.7)}
.step-label{background:#1565C0;color:rgba(255,255,255,0.85);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;padding:6px 16px 10px;flex-shrink:0}
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:16px}
.page.active{display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px}
.field input{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;background:#f8f9fa;color:#1a1a1a;outline:none}
.field input:focus{border-color:#1565C0;background:white}
.sec-total-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 12px;border-bottom:1px solid #eee;margin-bottom:4px}
.sec-total-bar .sec-name{font-size:13px;font-weight:600;color:#1565C0}
.sec-total-bar .sec-tot{font-size:13px;color:#555}
.btype-lbl{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin:14px 0 6px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tlen{font-size:14px;color:#555;width:32px;flex-shrink:0;font-weight:500}
.tctl{display:flex;align-items:center;border:1.5px solid #e0e0e0;border-radius:10px;overflow:hidden;flex:1;background:#f8f9fa}
.tctl button{width:44px;height:44px;background:#eef2f7;border:none;font-size:20px;color:#1565C0;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tctl button:active{background:#dde6f0}
.tctl input{flex:1;border:none;text-align:center;font-size:18px;font-weight:600;background:transparent;color:#1a1a1a;padding:0;width:0;min-width:0;height:44px}
.tctl input:focus{outline:none}
.tbd{font-size:11px;color:#aaa;width:52px;text-align:right;flex-shrink:0;line-height:1.3}
.tbd.has-val{color:#1565C0;font-weight:600}
.nav{display:flex;gap:10px;padding:12px 16px;border-top:1px solid #eee;flex-shrink:0;background:white}
.nbtn{flex:1;padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:white;color:#333}
.nbtn.pri{background:#1565C0;border-color:#1565C0;color:white}
.nbtn:active{opacity:0.75}
.sum-section{margin-bottom:16px}
.sum-hd{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;padding:8px 0 5px;border-bottom:1px solid #eee;margin-bottom:4px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
.sum-row:last-child{border:none}
.sum-row .lbl{color:#666}
.sum-row .val{font-weight:500;color:#1a1a1a}
.sum-subtotal{display:flex;justify-content:space-between;padding:8px 0 0;font-size:14px;font-weight:700;color:#1565C0;margin-top:2px}
.grand-total{background:#1565C0;border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.grand-total .lbl{font-size:14px;color:rgba(255,255,255,0.85);font-weight:600}
.grand-total .val{font-size:28px;font-weight:700;color:white}
.export-btn{width:100%;padding:16px;background:#2e7d32;border:none;border-radius:12px;font-size:16px;font-weight:700;color:white;cursor:pointer;margin-top:8px}
.export-btn:active{opacity:0.8}
.copy-btn{width:100%;padding:14px;background:white;border:1.5px solid #1565C0;border-radius:12px;font-size:15px;font-weight:600;color:#1565C0;cursor:pointer;margin-top:8px}
.copy-btn:active{opacity:0.75}
.new-job-btn{width:100%;padding:14px;background:white;border:1.5px solid #e53935;border-radius:12px;font-size:15px;font-weight:600;color:#e53935;cursor:pointer;margin-top:8px}
.new-job-btn:active{opacity:0.75}
.no-entry{font-size:13px;color:#aaa;padding:4px 0 8px;font-style:italic}
#install-banner{display:none;background:#E3F2FD;border-bottom:1px solid #BBDEFB;padding:10px 16px;font-size:13px;color:#1565C0;flex-shrink:0}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;overflow-y:auto;padding:0}
.overlay.active{display:block}
.overlay-toolbar{position:sticky;top:0;background:white;border-bottom:1px solid #eee;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:10000}
.overlay-toolbar .tbtn{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.overlay-toolbar .tbtn-back{background:white;border:1.5px solid #ddd;color:#333}
.overlay-toolbar .tbtn-print{background:#1565C0;border:none;color:white}
.overlay-toolbar .tbtn-copy{background:#2e7d32;border:none;color:white}
.overlay-content{padding:12px}
#install-banner button{background:#1565C0;color:white;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;margin-left:8px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="install-banner">
    Add to home screen for quick access <button onclick="installApp()">Add</button>
    <span onclick="document.getElementById('install-banner').style.display='none'" style="float:right;cursor:pointer;font-size:18px;line-height:1">×</span>
  </div>
  <div class="app-bar">
    <div class="app-bar-row">
      <div><div class="title">Board Take-Off</div><div class="sub" id="jobSub">New job</div></div>
      <div class="step-info" id="stepCtr">1 of 6</div>
    </div>
  </div>
  <div class="progress-bar" id="pips"></div>
  <div class="step-label" id="stepLbl">Job info</div>
  <div class="pages" id="pages">
    <div id="p0" class="page active">
      <div class="field"><label>Job name / Lot #</label><input type="text" id="fJob" placeholder="e.g. Lot 79" autocomplete="off" oninput="document.getElementById('jobSub').textContent=this.value||'New job';saveData()"></div>
      <div class="field"><label>Address</label><input type="text" id="fAddr" placeholder="Street address" autocomplete="off" oninput="saveData()"></div>
      <div class="field"><label>Builder</label><input type="text" id="fBuilder" placeholder="Builder name" autocomplete="off" oninput="saveData()"></div>
      <div class="field"><label>PM / Estimator</label><input type="text" id="fPM" placeholder="Your name" autocomplete="off" oninput="saveData()"></div>
    </div>
    <div id="p1" class="page"></div>
    <div id="p2" class="page"></div>
    <div id="p3" class="page"></div>
    <div id="p4" class="page"></div>
    <div id="p5" class="page"></div>
  </div>
  <div class="nav">
    <button class="nbtn" id="btnBack" style="display:none" onclick="go(-1)">← Back</button>
    <button class="nbtn pri" id="btnNext" onclick="go(1)">Next →</button>
  </div>
</div>

<div id="boardOverlay" class="overlay">
  <div class="overlay-toolbar">
    <button class="tbtn tbtn-back" onclick="document.getElementById('boardOverlay').classList.remove('active')">← Back</button>
    <button class="tbtn tbtn-print" onclick="printBoard()">🖨 Print</button>
    <button class="tbtn tbtn-copy" onclick="shareBoard()">Share / Copy</button>
  </div>
  <div class="overlay-content" id="boardContent"></div>
</div>

<script>
const SECTIONS = [
  {id:'floor1', label:'1st Floor', types:['5/8" X','5/8" GB','54" - 1/2"','1/2"','1/2" MR','1/2 - Cement']},
  {id:'floor2', label:'2nd Floor', types:['5/8"','5/8 - MR','54" - 1/2"','1/2"','1/2 - GB','1/2 - Cement']},
  {id:'garage',  label:'Garage',   types:['5/8"','5/8 - MR','54" - 1/2"','1/2"','1/2 - GB','1/2 Cement']},
  {id:'basement',label:'Basement', types:['5/8"','1/4"','54" - 1/2"','1/2"','1/2 - GB','1/2 - Cement']},
];
const LENGTHS = [16,14,12,10,9,8];
const STEPS = ['Job info','1st Floor','2nd Floor','Garage','Basement','Summary'];
const MULTIPLIERS = {'54" - 1/2"':4.5};

function mult(t){return MULTIPLIERS[t]||4;}
function boards(p,l,t){return Math.round(p*l*mult(t));}

let cur=0;
let data={};
SECTIONS.forEach(s=>{
  data[s.id]={};
  s.types.forEach(t=>{data[s.id][t]={};LENGTHS.forEach(l=>{data[s.id][t][l]=0;});});
});

function calcSec(sid){
  let tot=0;
  SECTIONS.find(s=>s.id===sid).types.forEach(t=>LENGTHS.forEach(l=>{tot+=boards(data[sid][t][l]||0,l,t);}));
  return tot;
}

function k(sid,ti,l){return sid+'_'+ti+'_'+l;}

function renderPips(){
  document.getElementById('pips').innerHTML=STEPS.map((_,i)=>
    '<div class="pip '+(i<cur?'done':i===cur?'active':'')+'"></div>').join('');
  document.getElementById('stepCtr').textContent=(cur+1)+' of '+STEPS.length;
  document.getElementById('stepLbl').textContent=STEPS[cur];
  document.getElementById('btnBack').style.display=cur>0?'block':'none';
  var isLast=cur===STEPS.length-1;
  document.getElementById('btnNext').style.display=isLast?'none':'block';
  document.getElementById('btnNext').textContent=cur===STEPS.length-2?'View Summary →':'Next →';
}

function renderSection(pageIdx,secIdx){
  const sec=SECTIONS[secIdx];
  const wrap=document.getElementById('p'+pageIdx);
  wrap.innerHTML='';

  const bar=document.createElement('div');
  bar.className='sec-total-bar';
  bar.innerHTML='<span class="sec-name">'+sec.label+'</span><span class="sec-tot" id="secTot_'+sec.id+'">'+calcSec(sec.id).toLocaleString()+' boards</span>';
  wrap.appendChild(bar);

  sec.types.forEach(function(type,ti){
    const lbl=document.createElement('div');
    lbl.className='btype-lbl';
    lbl.textContent=type;
    wrap.appendChild(lbl);

    LENGTHS.forEach(function(l){
      const v=data[sec.id][type][l]||0;
      const key=k(sec.id,ti,l);
      const row=document.createElement('div');
      row.className='trow';

      const lenSpan=document.createElement('span');
      lenSpan.className='tlen';
      lenSpan.textContent=l+"'";

      const ctl=document.createElement('div');
      ctl.className='tctl';

      const bm=document.createElement('button');
      bm.textContent='−';
      bm.addEventListener('click',function(){
        data[sec.id][type][l]=Math.max(0,(data[sec.id][type][l]||0)-1);
        updateRow(sec.id,type,ti,l);
      });

      const inp=document.createElement('input');
      inp.type='number';inp.min='0';inp.inputMode='numeric';
      inp.id='i_'+key;inp.placeholder='0';
      if(v)inp.value=v;
      inp.addEventListener('input',function(){
        data[sec.id][type][l]=parseInt(inp.value)||0;
        updateRow(sec.id,type,ti,l);
      });

      const bp=document.createElement('button');
      bp.textContent='+';
      bp.addEventListener('click',function(){
        data[sec.id][type][l]=(data[sec.id][type][l]||0)+1;
        updateRow(sec.id,type,ti,l);
      });

      ctl.appendChild(bm);ctl.appendChild(inp);ctl.appendChild(bp);

      const bdSpan=document.createElement('span');
      bdSpan.className='tbd'+(v>0?' has-val':'');
      bdSpan.id='bd_'+key;
      bdSpan.textContent=v>0?boards(v,l,type).toLocaleString()+' bd':'';

      row.appendChild(lenSpan);row.appendChild(ctl);row.appendChild(bdSpan);
      wrap.appendChild(row);
    });
  });
}

function updateRow(sid,type,ti,l){
  const v=data[sid][type][l]||0;
  const key=k(sid,ti,l);
  const inp=document.getElementById('i_'+key);
  if(inp)inp.value=v||'';
  const bdEl=document.getElementById('bd_'+key);
  if(bdEl){bdEl.textContent=v>0?boards(v,l,type).toLocaleString()+' bd':'';bdEl.className='tbd'+(v>0?' has-val':'');}
  const totEl=document.getElementById('secTot_'+sid);
  if(totEl)totEl.textContent=calcSec(sid).toLocaleString()+' boards';
  saveData();
}

function renderSummary(){
  const wrap=document.getElementById('p5');
  wrap.innerHTML='';
  let grand=0;

  SECTIONS.forEach(function(s){
    const tot=calcSec(s.id);
    grand+=tot;
    const sec=document.createElement('div');
    sec.className='sum-section';
    const hd=document.createElement('div');
    hd.className='sum-hd';hd.textContent=s.label;
    sec.appendChild(hd);
    let any=false;
    s.types.forEach(function(t){
      LENGTHS.forEach(function(l){
        const q=data[s.id][t][l]||0;
        if(q>0){
          any=true;
          const row=document.createElement('div');
          row.className='sum-row';
          row.innerHTML='<span class="lbl">'+t+' '+l+"'</span><span class=\"val\">"+q+' pcs → '+boards(q,l,t).toLocaleString()+' bd</span>';
          sec.appendChild(row);
        }
      });
    });
    if(!any){const e=document.createElement('div');e.className='no-entry';e.textContent='No entries';sec.appendChild(e);}
    const sub=document.createElement('div');
    sub.className='sum-subtotal';
    sub.innerHTML='<span>Subtotal</span><span>'+tot.toLocaleString()+' boards</span>';
    sec.appendChild(sub);
    wrap.appendChild(sec);
  });

  const gt=document.createElement('div');
  gt.className='grand-total';
  gt.innerHTML='<span class="lbl">Total boards</span><span class="val">'+grand.toLocaleString()+'</span>';
  wrap.appendChild(gt);

  const expBtn=document.createElement('button');
  expBtn.className='export-btn';
  expBtn.textContent='Open Board Order';
  expBtn.addEventListener('click',generatePDF);
  wrap.appendChild(expBtn);

  const copyBtn=document.createElement('button');
  copyBtn.className='copy-btn';
  copyBtn.textContent='Copy Summary Text';
  copyBtn.addEventListener('click',copySummary);
  wrap.appendChild(copyBtn);

  const newBtn=document.createElement('button');
  newBtn.className='new-job-btn';
  newBtn.textContent='+ Start New Job';
  newBtn.addEventListener('click',function(){
    if(confirm('Start a new job? This will clear all current data.')){location.reload();}
  });
  wrap.appendChild(newBtn);
}

function generatePDF(){
  var job=document.getElementById('fJob').value||'';
  var addr=document.getElementById('fAddr').value||'';
  var builder=document.getElementById('fBuilder').value||'';
  var pm=document.getElementById('fPM').value||'';

  var MULTS={'54" - 1/2"':{16:72,14:63,12:54,10:45,9:40.5,8:36}};
  function getMult(type,len){ return MULTS[type]?MULTS[type][len]:(len*4); }

  function secColTotal(sid,type){
    var t=0; LENGTHS.forEach(function(l){ t+=Math.round((data[sid][type][l]||0)*getMult(type,l)); }); return t;
  }
  function secGrandTotal(sid){
    var t=0; SECTIONS.find(function(s){return s.id===sid;}).types.forEach(function(type){ t+=secColTotal(sid,type); }); return t;
  }
  function overallTotal(){ var t=0; SECTIONS.forEach(function(s){ t+=secGrandTotal(s.id); }); return t; }

  function sectionHTML(sec){
    var typeHeaders=sec.types.map(function(t){
      return '<th colspan="2" class="typehd'+(t==='54" - 1/2"'?' blue54':'')+'">'+t+'</th>';
    }).join('');
    var rows='';
    LENGTHS.forEach(function(l){
      var cells=sec.types.map(function(type){
        var pcs=data[sec.id][type][l]||0;
        var bd=Math.round(pcs*getMult(type,l));
        var cls=type==='54" - 1/2"'?' blue54':'';
        return '<td class="inp'+cls+'">'+(pcs>0?pcs:'')+'</td><td class="calc'+cls+'">'+(bd>0?bd:'')+'</td>';
      }).join('');
      rows+='<tr><td class="len">'+l+"'</td>"+cells+'</tr>';
    });
    var totCells=sec.types.map(function(type){
      var tot=secColTotal(sec.id,type);
      var cls=type==='54" - 1/2"'?' blue54':'';
      return '<td class="tot inp'+cls+'"></td><td class="tot calc'+cls+'">'+(tot>0?tot:'')+'</td>';
    }).join('');
    rows+='<tr class="totrow"><td class="len">Total</td>'+totCells+'</tr>';
    return '<tr class="sechd"><td colspan="'+(1+sec.types.length*2)+'">'+sec.label+'</td></tr>'
      +'<tr class="colhd"><th class="lenhd">Len</th>'+typeHeaders+'</tr>'
      +rows;
  }

  var allHTML=SECTIONS.map(function(s){return sectionHTML(s);}).join('');
  var tot=overallTotal();
  var garTot=secGrandTotal('garage');
  var baseTot=secGrandTotal('basement');

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8">'
    +'<title>Board Order</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:Arial,sans-serif;font-size:6pt;background:#fff;padding:5px}'
    +'.co-header{text-align:center;margin-bottom:4px}'
    +'.co-header img{height:48px}'
    +'.main-layout{display:flex;gap:6px;align-items:flex-start}'
    +'.left{flex:1;min-width:0;overflow:hidden}'
    +'.right{width:90px;flex-shrink:0}'
    +'.info-table{width:100%;border-collapse:collapse;margin-bottom:4px}'
    +'.info-table tr{border-bottom:0.5px solid #ccc}'
    +'.info-table td.lbl{font-weight:bold;white-space:nowrap;padding:1px 3px;width:44px;font-size:6pt}'
    +'.info-table td.val{border-bottom:1px solid #999;padding:1px 3px;font-size:6.5pt}'
    +'table.sec{width:100%;border-collapse:collapse;table-layout:fixed}'
    +'tr.sechd td{background:#555;color:#fff;font-weight:bold;font-size:7pt;padding:2px 3px}'
    +'tr.colhd th{background:#d0d0d0;font-size:5pt;font-weight:bold;text-align:center;padding:1px 0;border:0.5px solid #aaa;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}'
    +'th.lenhd{width:16px}'
    +'th.typehd{}'
    +'th.blue54{background:#c5dff0}'
    +'tbody tr:nth-child(odd) td{background:#fff}'
    +'tbody tr:nth-child(even) td{background:#f5f5f5}'
    +'td{border:0.5px solid #ccc;padding:1px 1px;text-align:center;font-size:6pt;overflow:hidden}'
    +'td.len{font-weight:bold;background:#e0e0e0!important;border:0.5px solid #aaa;width:16px}'
    +'td.inp{font-weight:700;font-size:6.5pt}'
    +'td.calc{background:#daedf7!important;font-size:5.5pt;color:#222}'
    +'td.blue54{background:#daedf7!important}'
    +'td.inp.blue54{background:#daedf7!important}'
    +'td.calc.blue54{background:#c5dff0!important}'
    +'tr.totrow td{background:#c0c0c0!important;font-weight:bold;border-top:1px solid #888}'
    +'tr.totrow td.calc{background:#b5b5b5!important}'
    +'tr.totrow td.calc.blue54{background:#a8ccdf!important}'
    +'.totals-box{border:1px solid #ccc}'
    +'.tot-row{padding:4px 5px;border-bottom:0.5px solid #eee}'
    +'.tot-row:last-child{border-bottom:none}'
    +'.tot-lbl{font-size:5.5pt;font-weight:bold;color:#555;text-transform:uppercase}'
    +'.tot-val{font-size:14pt;font-weight:bold;color:#000;line-height:1.1}'
    +'.pm-label{font-size:5.5pt;color:#666;text-align:center;margin-top:4px}'
    +'.notes{margin-top:4px}'
    +'.notes-lbl{font-size:7pt;font-weight:bold;margin-bottom:2px}'
    +'.nl{border-bottom:1px solid #999;height:14px;margin-bottom:3px}'
    +'@media print{'
    +'@page{size:letter portrait;margin:6mm}'
    +'body{padding:0}'
    +'*{-webkit-print-color-adjust:exact;print-color-adjust:exact}'

function copySummary(){
  var job=document.getElementById('fJob').value||'Job';
  var addr=document.getElementById('fAddr').value||'';
  var builder=document.getElementById('fBuilder').value||'';
  var pm=document.getElementById('fPM').value||'';
  var lines=['Board Take-Off - '+job];
  if(addr)lines.push('Address: '+addr);
  if(builder)lines.push('Builder: '+builder);
  if(pm)lines.push('PM: '+pm);
  lines.push('');
  var grand=0;
  SECTIONS.forEach(function(s){
    var tot=calcSec(s.id);grand+=tot;
    lines.push(s.label+': '+tot.toLocaleString()+' boards');
    s.types.forEach(function(t){LENGTHS.forEach(function(l){var q=data[s.id][t][l]||0;if(q>0)lines.push('  '+t+' '+l+"ft: "+q+' pcs > '+boards(q,l,t).toLocaleString()+' boards');});});
  });
  lines.push('\nTOTAL: '+grand.toLocaleString()+' boards');
  var text=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){alert('Copied!');});}
  else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Copied!');}
}

function go(dir){
  if(dir===1&&cur===STEPS.length-1)return;
  document.getElementById('p'+cur).classList.remove('active');
  cur+=dir;
  document.getElementById('p'+cur).classList.add('active');
  if(cur>=1&&cur<=4)renderSection(cur,cur-1);
  if(cur===5)renderSummary();
  document.getElementById('pages').scrollTop=0;
  renderPips();
}

function saveData(){
  try{
    localStorage.setItem('takeoff',JSON.stringify({
      data:data,
      job:document.getElementById('fJob').value,
      addr:document.getElementById('fAddr').value,
      builder:document.getElementById('fBuilder').value,
      pm:document.getElementById('fPM').value
    }));
  }catch(e){}
}

function loadData(){
  try{
    var saved=localStorage.getItem('takeoff');
    if(!saved)return;
    var state=JSON.parse(saved);
    if(state.data)data=state.data;
    if(state.job){document.getElementById('fJob').value=state.job;document.getElementById('jobSub').textContent=state.job;}
    if(state.addr)document.getElementById('fAddr').value=state.addr;
    if(state.builder)document.getElementById('fBuilder').value=state.builder;
    if(state.pm)document.getElementById('fPM').value=state.pm;
  }catch(e){}
}

var deferredPrompt;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-banner').style.display='block';
});
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;document.getElementById('install-banner').style.display='none';});}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}

loadData();
renderPips();

function printBoard(){
  var content = document.getElementById('boardContent').innerHTML;
  var win = window.open('','_blank','');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><style>@media print{@page{size:letter portrait;margin:6mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>'+content+'</body></html>');
  win.document.close();
  win.focus();
  setTimeout(function(){ win.print(); }, 500);
}

function shareBoard(){
  var content = document.getElementById('boardContent').innerHTML;
  var text = document.getElementById('boardContent').innerText;
  if(navigator.share){
    navigator.share({title:'Board Order', text:text}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ alert('Summary copied to clipboard!'); });
  } else {
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Copied!');
  }
}
